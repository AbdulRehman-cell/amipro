# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: amipro
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: NODE_VERSION
        value: 20.15.1
